<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خميسنا أحلى</title>
<meta name="theme-color" content="#5b21b6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1a6e;--v:#33227f;--v2:#4b3aa8;--teal:#3f7ea8;--teal2:#4a90b5;--cy:#7fcbe0;--lav:#a4a1f3;--lav2:#e8e7fd;--lav3:#f4f4fe;--mut:#5f5c7d;--bg:#ffffff;--card:#f7f8fd;--o:#ef9550;--p:#d9568f;
--g1:linear-gradient(135deg,#2c1a74 0%,#3b4f9c 55%,#4a8fb3 100%);--g2:linear-gradient(90deg,#7b5cf0 0%,#d9568f 55%,#ef9550 100%);--g3:linear-gradient(110deg,#4a8fb3 0%,#6d5aa8 50%,#2c1a74 100%);--badge:linear-gradient(90deg,#7b7ff0,#7fcbe0);
--r:28px;--sh:0 14px 34px -18px rgba(44,26,116,.35)}
body.dark{--ink:#eceafd;--v:#cfcafc;--mut:#b7b4d6;--bg:#141033;--card:#1e1946;--lav2:#2d2763;--lav3:#231d52}
body.hc{--mut:#1b1440;--lav:#2c1a74;--lav2:#c9c6f7}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;padding-bottom:90px;transition:background .3s}
h1,h2,h3,h4,.logo,.sec{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.35;color:var(--ink)}
a{color:var(--teal)}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
/* HEADER */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--lav2);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.seal{display:grid;place-items:center;text-align:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#5b48c4,#22145e);border:3px solid #e6c46b;box-shadow:0 0 0 2px #2c1a74,0 6px 16px -6px rgba(44,26,116,.6);color:#fff;text-decoration:none;line-height:1;font-family:"Readex Pro"}
.seal span{font-size:11px;color:#bfe7f2}.seal b{font-size:14px;color:#ffe08a}.seal small{display:none}
.seal.big{width:150px;height:150px;margin:0 auto 14px;border-width:5px;animation:bob 6s ease-in-out infinite}.seal.big span{font-size:24px}.seal.big b{font-size:34px}.seal.big small{display:block;font-size:12px;color:#cfd8ff;margin-top:4px}
@keyframes bob{50%{transform:translateY(-6px)}}
.tools{display:flex;gap:8px}
.rbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--lav2);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:20px;transition:all .2s}
.rbtn:hover{border-color:var(--lav);transform:translateY(-1px)}
.menu{display:none;grid-template-columns:1fr 1fr;gap:4px 14px;padding:12px 18px 16px;border-bottom:1px solid var(--lav2);background:var(--bg);position:sticky;top:69px;z-index:29}
.menu-open .menu{display:grid;animation:fade .25s}
.menu a{text-decoration:none;color:var(--ink);font-size:17px;padding:8px 14px;border-radius:999px}
.menu a.on,.menu a:hover{background:var(--lav2)}
.menu-open .i-menu{display:none}.i-x{display:none}.menu-open .i-x{display:block}
#app{opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .4s ease}#app.in{opacity:1;transform:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.page{padding-top:14px;padding-bottom:30px}
/* HERO */
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#4c3bb0 0%,#33227f 45%,#24165e 100%);color:#fff;padding:40px 16px 46px;text-align:center}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(127,203,224,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(127,203,224,.08) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(ellipse at center,#000 35%,transparent 75%)}
.glow{position:absolute;width:520px;height:520px;left:50%;top:-40px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(127,203,224,.18);box-shadow:0 0 120px rgba(127,203,224,.18) inset}
.hero-in{position:relative;max-width:900px;margin:0 auto}
.kicker{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1.5px solid rgba(164,161,243,.55);border-radius:999px;padding:8px 20px;font-size:15px}.kicker .ic{color:var(--cy)}
.logo{font-size:clamp(46px,11vw,86px);margin:16px 0 0;color:#fff;font-weight:700}
.tagline{color:var(--cy);font-family:"Readex Pro";font-size:clamp(20px,4.5vw,30px);font-weight:600;margin:4px 0 12px}
.lead{max-width:680px;margin:0 auto 22px;font-size:clamp(16px,2.4vw,18.5px);color:#e5e3ff}
.count{background:rgba(255,255,255,.07);border:1.5px solid rgba(164,161,243,.45);border-radius:var(--r);padding:18px;max-width:500px;margin:0 auto}
.ctitle{font-family:"Readex Pro";font-weight:600;font-size:18px}.cdate{color:var(--cy);display:block;margin-bottom:10px}
.cdown{display:flex;justify-content:center;gap:12px;margin-bottom:14px}
.cdown div{background:rgba(255,255,255,.1);border:1.5px solid rgba(127,203,224,.4);border-radius:20px;min-width:80px;padding:8px}
.cdown b{display:block;font-family:"Readex Pro";font-size:34px;line-height:1.1;color:#fff}.cdown small{font-size:13px;color:#cfd8ff}
.cdown .live{background:var(--badge);color:#fff;font-weight:700;padding:10px 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-26px auto 0;position:relative;max-width:640px}
.stats div{background:var(--bg);border:2px solid var(--lav2);border-radius:22px;padding:12px 4px;text-align:center;box-shadow:var(--sh)}
.stats b{display:block;font-family:"Readex Pro";font-size:32px;line-height:1.1;color:var(--v)}.stats small{color:var(--mut);font-size:13.5px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;background:var(--teal);color:#fff;font:inherit;font-weight:600;padding:12px 24px;border-radius:999px;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 18px -10px rgba(63,126,168,.9)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.hot{background:var(--g3)}
.hero .btn.hot{background:linear-gradient(90deg,#4a8fb3,#7b7ff0)}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--lav2);box-shadow:none}
.btn.big{width:100%;padding:16px;font-size:18px;margin-top:12px}
.btn.sm{padding:6px 16px;font-size:14px}
.btn.disabled{background:var(--lav3);color:var(--mut);box-shadow:none;cursor:default;font-weight:500;font-size:14px}
.btn[disabled]{opacity:.6}
/* SECTIONS */
.sec{font-size:clamp(26px,5.5vw,34px);margin:44px 0 18px;text-align:center;color:var(--v)}
.sec::after{content:"";display:block;width:70px;height:6px;border-radius:9px;background:var(--teal);margin:12px auto 0}
.intro{font-size:17.5px;text-align:justify;color:var(--v)}
.vm{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.vmc{background:var(--card);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh);border-top:6px solid var(--teal)}
.vmc.c2{border-top-color:var(--cy)}
.vmc h3{font-size:28px;margin:0 0 6px;color:var(--v)}.vmc p{margin:0;font-size:17px;color:var(--v)}
@media(max-width:700px){.vm{grid-template-columns:1fr}}
.vals{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 18px}.vals span{background:var(--lav2);color:var(--v);border-radius:999px;padding:6px 18px;font-weight:600}
.goals{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.goal{background:var(--card);border-radius:24px;padding:18px 12px;text-align:center;box-shadow:var(--sh)}
.gi{width:40px;height:40px;color:var(--teal);margin-bottom:6px}
.goal b{display:block;font-size:17px;font-family:"Readex Pro";color:var(--v)}.goal small{color:var(--mut);font-size:14px}
@media(max-width:820px){.goals{grid-template-columns:repeat(2,1fr)}.goal:last-child{grid-column:span 2}}
/* double-ring cards */
.track,.box,.evcard,.qcard,.ind,.test,.todo2,.done{background:var(--card);border:3px solid var(--lav);box-shadow:0 0 0 6px var(--lav2),var(--sh);border-radius:var(--r)}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.track{position:relative;padding:20px 18px 16px;transition:transform .25s}
.track:hover{transform:translateY(-4px)}
.track .tic{font-size:36px;margin-top:22px}.track b{display:block;font-size:19px;font-family:"Readex Pro";color:var(--v)}.track small{display:block;color:var(--mut);font-size:14.5px;line-height:1.6}
.track.idea{opacity:.9}
.tev{margin-top:8px;font-size:14px;color:var(--teal);font-weight:600}
.badge{position:absolute;top:14px;inset-inline-end:14px;background:var(--badge);color:#fff;border-radius:999px;padding:3px 14px;font-size:13px;font-weight:700;box-shadow:0 6px 14px -6px rgba(123,127,240,.8)}
.badge.soft{background:var(--lav2);color:var(--v);box-shadow:none}
.chip{display:inline-block;border-radius:999px;padding:1px 12px;font-size:12.5px;font-weight:700;color:#fff;background:var(--badge)}
.chip.c-done{background:linear-gradient(90deg,#3f9e8a,#7fcbe0)}.chip.c-draft{background:#9aa0b8}
.portals{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.portal{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:26px 24px;border-radius:var(--r);color:#fff;text-decoration:none;min-height:200px;box-shadow:0 0 0 6px var(--lav2),var(--sh);border:3px solid var(--lav);transition:transform .25s}
.portal:hover{transform:translateY(-4px)}
.portal .pic{width:46px;height:46px;color:var(--cy)}.portal b{font-family:"Readex Pro";font-size:28px}.portal small{font-size:16px;opacity:.92;line-height:1.7}
.portal .go{margin-top:auto;font-weight:700;font-size:17px;display:inline-flex;gap:8px;align-items:center}
.p1{background:var(--g2)}.p1 .pic{color:#fff}.p2{background:var(--g1)}.p3{background:var(--g3)}.p4{background:linear-gradient(135deg,#1d1250,#33227f)}
@media(max-width:640px){.portals{grid-template-columns:1fr}.portal{min-height:170px}}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:34px 0 10px}
.qcard{padding:18px;text-decoration:none;color:var(--ink)}
.qcard b{display:block;font-family:"Readex Pro";font-size:18px;color:var(--v)}.qcard small{color:var(--mut);font-size:14px;display:block}
.lnk{color:var(--teal);font-weight:700;display:inline-flex;gap:6px;align-items:center;margin-top:8px}
@media(max-width:820px){.quick{grid-template-columns:repeat(2,1fr)}}
/* PAGES */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--lav2);border-radius:999px;padding:6px 16px;margin-bottom:12px}
.pbanner{position:relative;overflow:hidden;background:var(--g1);border-radius:var(--r);padding:38px 18px;text-align:center;color:#fff;margin-bottom:18px}
.pbanner::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:30px 30px}
.pbanner .ptitle{position:relative;color:#fff;font-size:clamp(32px,8vw,48px);margin:0}.pbanner p{position:relative;margin:6px 0 0;font-size:17px;color:#e3eafc}
.psub{color:var(--mut);margin-top:0}
.ministeps{display:flex;gap:8px;overflow-x:auto;margin:6px 0 14px;padding:2px}
.ms{flex:1 0 auto;display:inline-flex;gap:6px;justify-content:center;align-items:center;text-decoration:none;color:var(--ink);background:var(--lav3);border:2px solid var(--lav2);border-radius:999px;padding:8px 16px;font-size:14.5px;white-space:nowrap}
.ms.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}.ms.past{border-color:var(--lav)}
.evpick{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.evbtn{scroll-snap-align:start;flex:0 0 auto;display:grid;grid-template-columns:auto 1fr;column-gap:10px;text-align:start;background:var(--bg);border:2px solid var(--lav2);border-radius:22px;padding:10px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.evbtn span{grid-row:span 2;font-size:28px}.evbtn small{color:var(--mut);font-size:12.5px}
.evbtn.on{border-color:var(--teal);background:var(--lav3);box-shadow:0 0 0 4px var(--lav2)}
.todo2{padding:20px 18px;margin:6px 0 22px}
.todo2 h2{margin:0 0 6px;font-size:26px;color:var(--v)}
.tdo{display:grid;grid-template-columns:auto auto 1fr;grid-template-areas:"n i t" "g g g";gap:6px 12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--bg);border:2px solid var(--lav2);border-radius:22px;padding:14px;margin:12px 0;transition:all .2s}
.tdo:hover{border-color:var(--lav);transform:translateY(-2px)}
.tn{grid-area:n;background:var(--badge);color:#fff;border-radius:999px;width:32px;height:32px;display:grid;place-items:center;font-weight:700}
.ti{grid-area:i;color:var(--teal)}.ti .ic{width:30px;height:30px}.tt{grid-area:t}.tt b{display:block;font-size:18px;font-family:"Readex Pro";color:var(--v)}.tt small{color:var(--mut);font-size:14.5px;line-height:1.6;display:block}
.tgo{grid-area:g;justify-self:end;background:var(--teal);color:#fff;border-radius:999px;padding:7px 18px;font-weight:600;font-size:14.5px}
@media(min-width:700px){.tdo{grid-template-columns:auto auto 1fr auto;grid-template-areas:"n i t g"}}
.box{padding:20px;margin:22px 0}
.box h3{margin:0 0 6px;color:var(--v)}.box h4{margin:16px 0 6px;color:var(--v)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:22px 0}.grid2 .box{margin:0}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.evcard{padding:22px;margin-top:12px}
.evhead{display:flex;gap:14px;align-items:center}.evic{font-size:44px;background:var(--lav2);border-radius:22px;padding:6px 12px}
.evhead h2{margin:0;font-size:24px;color:var(--v)}.meta{color:var(--mut);font-size:14px}
.evcard h4{margin:18px 0 2px;color:var(--teal)}
.poster{width:100%;max-height:540px;object-fit:contain;border-radius:22px;margin-top:12px;background:var(--lav3)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.phases div{background:var(--bg);border:2px solid var(--lav2);border-radius:18px;padding:12px}.phases b{display:block;color:var(--teal)}.phases small{color:var(--mut)}
@media(max-width:600px){.phases{grid-template-columns:1fr}}
.small{font-size:14px;color:var(--mut)}
.warn{color:#9a3412;background:#fff7ed;border-radius:14px;padding:6px 12px}
.tag{display:inline-block;background:var(--lav2);color:var(--v);border-radius:999px;padding:3px 12px;font-size:13.5px;margin:2px}
/* FORMS */
label{display:block;font-weight:500;margin:10px 0}
input,select,textarea{display:block;width:100%;font:inherit;border:2px solid var(--lav2);border-radius:18px;padding:10px 14px;background:var(--bg);margin-top:4px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--lav2)}
input[type=radio],input[type=checkbox]{width:auto;display:inline}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.row3,.row2{grid-template-columns:1fr}}
.codebox{border:2px dashed var(--lav);border-radius:22px;padding:8px 16px 14px;margin:8px 0 14px;background:var(--lav3)}
.codebox legend{font-weight:700;padding:0 6px;color:var(--v)}.codebox legend small{font-weight:400;color:var(--mut)}
.mycode{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;background:var(--lav3);border:2px solid var(--lav2);border-radius:999px;padding:6px 8px 6px 14px;margin:6px 0 12px}.mycode span{display:inline-flex;gap:6px;align-items:center;padding-inline-start:6px}.mycode b{color:var(--teal);font-size:18px;letter-spacing:1px}
.row2.keep{grid-template-columns:1fr 1fr!important}.row2.keep label{margin:4px 0}
.codeprev{font-size:14px;color:var(--mut)}.codeprev b{color:var(--teal);font-size:19px;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips.col{flex-direction:column;align-items:flex-start}
.pill{margin:0;cursor:pointer;position:relative}.pill input{position:absolute;opacity:0}
.pill span{display:inline-block;border:2px solid var(--lav2);border-radius:999px;padding:7px 16px;background:var(--lav3);transition:all .15s}
.pill input:checked+span{background:var(--teal);border-color:var(--teal);color:#fff}
.pill input:focus-visible+span{box-shadow:0 0 0 4px var(--lav2)}
.btnpill{border:2px solid var(--lav2);border-radius:999px;padding:4px 14px;background:var(--lav3);font:inherit;cursor:pointer;color:var(--ink)}.btnpill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.lbl{display:block;margin:14px 0 4px;color:var(--v)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.face{position:relative;margin:0;text-align:center;cursor:pointer;border:2px solid var(--lav2);border-radius:20px;padding:10px 2px;background:var(--bg);transition:all .2s}
.face input{position:absolute;opacity:0}.face .fe{display:block;font-size:36px;transition:transform .25s}.face small{font-size:12px;line-height:1.3;display:block}
.face:has(input:checked){border-color:var(--teal);background:var(--lav2);box-shadow:0 0 0 4px var(--lav2)}.face:has(input:checked) .fe{transform:scale(1.25)}
.testhead{display:flex;gap:12px;align-items:center;background:var(--g1);color:#fff;border-radius:var(--r);padding:18px 20px}
.testhead span{font-size:42px}.testhead h2{margin:0;color:#fff}.testhead small{color:#cfe3ff}
.test{padding:18px;margin-top:20px}
.prog{height:10px;background:var(--lav2);border-radius:999px;overflow:hidden;position:sticky;top:72px;z-index:5;margin-bottom:8px}.bar{height:100%;width:0;background:var(--badge);transition:width .3s}
.q{border:2px solid var(--lav2);background:var(--bg);border-radius:22px;padding:14px 16px;margin:14px 0}
.qn{font-size:13px;color:var(--teal);font-weight:700}.qt{font-weight:600;margin:4px 0 10px;font-size:17px;color:var(--v)}
.opts{display:grid;gap:8px}.opt{margin:0;cursor:pointer;position:relative}.opt input{position:absolute;opacity:0}
.opt span{display:block;border:2px solid var(--lav2);background:var(--lav3);border-radius:999px;padding:10px 18px;transition:all .15s}
.opt input:checked+span{border-color:var(--teal);background:var(--teal);color:#fff;font-weight:600}
.ex{background:var(--lav3);border-inline-start:4px solid var(--cy);border-radius:12px;padding:6px 12px;font-size:14px;color:var(--mut);margin-bottom:8px}
.savebar{background:#fefce8;color:#854d0e;border-radius:16px;padding:8px 14px;font-size:14px;margin-top:14px}.savebar.on{background:#dcfce7;color:#166534}
.part{margin:22px 0 4px;color:var(--v);font-size:21px}
.satbox{background:var(--lav3);border:3px solid var(--cy);border-radius:var(--r);padding:16px;margin:18px 0}
.satbox h3{margin:0 0 4px;color:var(--teal)}.satbox .fe{font-size:40px}
.satrow{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--lav)}.sfaces{display:flex;gap:8px;flex-wrap:wrap}.sfaces span{font-size:24px;text-align:center;line-height:1}.sfaces small{display:block;font-size:12px}
@media(max-width:480px){.satrow{grid-template-columns:1fr auto}.satrow .sfaces{grid-column:span 2;order:3}}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.parts div{background:var(--bg);border:2px solid var(--lav2);border-radius:18px;padding:10px;text-align:center}.parts span{font-size:28px;display:block}
.mech{background:var(--g1);color:#fff;border-radius:var(--r);padding:22px;margin:22px 0;box-shadow:0 0 0 6px var(--lav2)}
.mech h3{color:#fff;margin-top:0}
